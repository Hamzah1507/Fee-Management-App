name: fees_management_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # PDF & Printing
  pdf: ^3.10.1
  printing: ^5.12.0

  # Charts
  fl_chart: ^0.68.0

  # Excel
  syncfusion_flutter_xlsio: ^25.1.41

  # Sharing
  share_plus: ^10.0.0

  # Other
  path_provider: ^2.0.15
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/gls_logo.png
    - assets/images/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icon.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/icon.png
  fullscreen: false
  image_size: 0.4